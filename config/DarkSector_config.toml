# XenonRecomp config for Dark Sector (Xbox 360, TitleID 445007D4, Europe disc)
# Paths are relative to this file. Build the `recompile` target to run it.
[main]
file_path = "../game/extracted/default.xex"
out_directory_path = "../generated/ppc"
switch_table_file_path = "DarkSector_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (unique byte-pattern matches in .text; see tools/find_helpers.py)
restgprlr_14_address = 0x827D6380
savegprlr_14_address = 0x827D6330
restfpr_14_address   = 0x827D6B6C
savefpr_14_address   = 0x827D6B20
restvmx_14_address   = 0x827D79F8
savevmx_14_address   = 0x827D7760
restvmx_64_address   = 0x827D7A8C
savevmx_64_address   = 0x827D77F4

# CRT setjmp/longjmp (libjpeg's error handling uses them; same CRT as Conan's)
setjmp_address  = 0x829A39C0
longjmp_address = 0x829A36A0

# Functions whose branches or switch tables leave the analyser's bounds
# (see tools/fix_switch_bounds.py).
functions = [
    # memset: its tail ("stb; bdzlr; stb 1; bdzlr; stb 2; blr") was split into
    # three functions, so fills ending in 2-3 odd bytes left 1-2 bytes unwritten
    # (garbled indentation in the save settings and the level-load crash).
